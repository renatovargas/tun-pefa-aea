lang: en-US
csl: assets/apa-en.csl

website:
  title: "Tunisia: energy and emissions accounts"
  description: "Physical energy flow accounts (PEFA) and air emissions accounts (AEA) for Tunisia"
  navbar:
    left:
      - href: en/index.qmd
        text: Home
      - href: en/documents/index.qmd
        text: Documents
      - href: en/presentations/index.qmd
        text: Presentations
      - href: en/explorer/index.qmd
        text: Data explorer
      - href: en/downloads.qmd
        text: Downloads
      - href: en/about.qmd
        text: About
    right:
      - text: "Language"
        menu:
          - text: "Français"
            href: "#lang-fr"
          - text: "English"
            href: "#lang-en"
          - text: "العربية"
            href: "#lang-ar"
  sidebar:
    - title: Documents
      style: docked
      contents:
        - href: en/documents/index.qmd
          text: Documents
        - href: en/documents/energy-accounts/index.qmd
          text: Energy accounts (PEFA)
        - href: en/documents/emissions-accounts/index.qmd
          text: Air emissions accounts (AEA)

format:
  html:
    theme:
      - yeti
      - assets/styles.scss
