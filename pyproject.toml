[project]
name = "tun-pefa-aea"
version = "0.1.0"
description = "Comptes physiques des flux d'énergie (PEFA) et comptes des émissions atmosphériques (AEA) de la Tunisie : site Quarto et pipeline reproductible."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "renatovargas" }]
dependencies = [
  "polars>=1.10",
  "pandas>=2.2,<3",  # outils FMI écrits pour pandas 2
  "pyarrow>=17",
  "numpy>=1.26",
  "fastexcel>=0.12",
  "openpyxl>=3.1",
  "xlsxwriter>=3.2",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "pyyaml>=6.0",
  "jupyter>=1.1",
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "nbclient>=0.10",
]

[tool.uv]
package = false
