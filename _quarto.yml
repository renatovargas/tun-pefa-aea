# Configuration shared by the three languages.
# Each language has its profile (_quarto-en.yml, _quarto-fr.yml, _quarto-ar.yml), which sets
# the language, the navigation and the files to render. Full render: `bash scripts/render.sh`.
# Rendering never runs the pipeline: documents only read data/outputs/ (see README.md).
project:
  type: website
  output-dir: docs
  execute-dir: project
  # data/outputs/accounts/ is not copied into docs/: download buttons point to the raw files on GitHub.
  resources:
    - assets/
  # Each profile adds its own folder to this list (Quarto concatenates lists).
  render:
    - "!research/"
    - "!refs/"
    - "!imf-tools/"

website:
  title: "Tunisia PEFA-AEA"
  site-url: https://renatovargas.github.io/tun-pefa-aea/
  repo-url: https://github.com/renatovargas/tun-pefa-aea
  repo-branch: main
  repo-actions: [source]
  page-navigation: true
  search: false

format:
  html:
    css: assets/styles.css
    toc: true
    include-after-body: assets/lang-switch.html

execute:
  freeze: auto
  warning: false
