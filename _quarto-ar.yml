# Arabic profile. Render: quarto render ar --profile ar --no-clean
project:
  render:
    - ar/**/*.qmd

lang: ar-TN
dir: rtl
csl: assets/apa-ar.csl

# Quarto has no Arabic UI strings; they are set here.
language:
  toc-title-document: "المحتويات"
  toc-title-website:
  title: "تونس: حسابات الطاقة والانبعاثات"
  description: "حسابات التدفقات المادية للطاقة وحسابات انبعاثات الهواء في تونس"
  navbar:
    left:
      - href: ar/index.qmd
        text: الرئيسية
      - href: ar/documents/index.qmd
        text: الوثائق
      - href: ar/presentations/index.qmd
        text: العروض
      - href: ar/explorer/index.qmd
        text: مستكشف البيانات
      - href: ar/downloads.qmd
        text: التنزيلات
      - href: ar/about.qmd
        text: حول الموقع
    right:
      - text: "اللغة"
        menu:
          - text: "Français"
            href: "#lang-fr"
          - text: "English"
            href: "#lang-en"
          - text: "العربية"
            href: "#lang-ar"
  sidebar:
    - title: الوثائق
      style: docked
      contents:
        - href: ar/documents/index.qmd
          text: الوثائق
        - href: ar/documents/energy-accounts/index.qmd
          text: حسابات الطاقة (PEFA)
        - href: ar/documents/emissions-accounts/index.qmd
          text: حسابات انبعاثات الهواء (AEA)

format:
  html:
    theme:
      - yeti
      - assets/styles.scss
      - assets/styles-ar.scss

