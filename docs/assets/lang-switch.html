<script>
// Language menu. The trees en/, fr/ and ar/ are mirrors: the same page exists
// at the same path in each language. Menu links point to "#lang-xx" and this
// script replaces them with the matching page in the other language.
document.addEventListener("DOMContentLoaded", function () {
  var segment = /\/(fr|en|ar)\/(?!.*\/(fr|en|ar)\/)/;
  var path = window.location.pathname;
  document.querySelectorAll('a[href$="#lang-fr"], a[href$="#lang-en"], a[href$="#lang-ar"]').forEach(function (a) {
    var target = a.getAttribute("href").slice(-2);
    var dest;
    if (segment.test(path)) {
      dest = path.replace(segment, "/" + target + "/");
    } else {
      // Root page (language picker): go to the home page of the language
      dest = path.replace(/[^\/]*$/, "") + target + "/index.html";
    }
    a.setAttribute("href", dest);
  });
});
</script>
